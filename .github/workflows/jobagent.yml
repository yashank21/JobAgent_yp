name: JobAgent Daily Digest

# Daily digest at 8:00 AM IST
on:
  schedule:
    - cron: "0 8 * * *"
      timezone: "Asia/Kolkata"

  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: false
        default: "refresh"
        type: choice
        options:
          - refresh
          - cache_only

jobs:
  run-jobagent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout JobAgent
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python
        run: |
          python --version
          python -m pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install playwright==1.62.0

      - name: Verify Playwright
        run: |
          python -m pip show playwright
          python -c "import playwright; print('Playwright imported from:', playwright.__file__)"
          python -c "from playwright.async_api import async_playwright; print('Playwright async API import: OK')"

      - name: Install Playwright browser
        run: |
          python -m playwright install --with-deps chromium

      - name: Restore JobAgent cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/job_cache.db
            data/job_cache.db-wal
            data/job_cache.db-shm
          key: job-cache-${{ github.run_id }}
          restore-keys: |
            job-cache-

      - name: Run JobAgent
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -c "from playwright.async_api import async_playwright; print('Final Playwright check: OK')"
          python run_jobagent.py --resume resume/Yashank_Patidar_resume_NITK.pdf --non-interactive --mode ${{ github.event.inputs.mode || 'refresh' }}

      - name: Persist JobAgent cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/job_cache.db
            data/job_cache.db-wal
            data/job_cache.db-shm
          key: job-cache-${{ github.run_id }}